[package]
name = "exec-rs"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of C++ std::execution (P2300)"
license = "Apache-2.0"
repository = "https://github.com/yuchao/exec-rs"
keywords = ["async", "execution", "sender", "receiver", "p2300"]
categories = ["asynchronous", "concurrency"]

[dependencies]
pin-project-lite = "0.2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
wait_on_address = "0.1"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }

[dev-dependencies]
static_assertions = "1.1"
tokio = { version = "1", features = ["full"] }
ctrlc = "3.4"

[features]
default = []
std = []

# Basic examples
[[example]]
name = "hello_world"
path = "examples/basics/hello_world.rs"

[[example]]
name = "let_value"
path = "examples/basics/let_value.rs"

[[example]]
name = "when_all"
path = "examples/basics/when_all.rs"

[[example]]
name = "error_handling"
path = "examples/basics/error_handling.rs"

[[example]]
name = "thread_pool"
path = "examples/basics/thread_pool.rs"

[[example]]
name = "split"
path = "examples/basics/split.rs"

[[example]]
name = "counting_scope"
path = "examples/basics/counting_scope.rs"

# Algorithm examples
[[example]]
name = "parallel_for"
path = "examples/algorithms/parallel_for.rs"

[[example]]
name = "retry"
path = "examples/algorithms/retry.rs"

[[example]]
name = "async_inclusive_scan"
path = "examples/async_inclusive_scan.rs"

# Echo server examples
[[example]]
name = "tokio_echo"
path = "examples/echo_server/tokio_echo.rs"

[[example]]
name = "exec_echo"
path = "examples/echo_server/exec_echo.rs"

# Timed scheduler examples
[[example]]
name = "timed_scheduler"
path = "examples/timed_scheduler/sync.rs"

[[example]]
name = "timed_scheduler_async"
path = "examples/timed_scheduler/async.rs"

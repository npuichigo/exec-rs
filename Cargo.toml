[package]
name = "exec-rs"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of C++ std::execution (P2300)"
license = "Apache-2.0"
repository = "https://github.com/yuchao/exec-rs"
keywords = ["async", "execution", "sender", "receiver", "p2300"]
categories = ["asynchronous", "concurrency"]

[dependencies]
pin-project-lite = "0.2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
wait_on_address = "0.1"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }

[dev-dependencies]
static_assertions = "1.1"
tokio = { version = "1", features = ["full"] }
ctrlc = "3.4"

[features]
default = []
std = []

[[example]]
name = "tokio_echo"
path = "examples/tokio_echo.rs"

[[example]]
name = "exec_echo"
path = "examples/exec_echo.rs"
